[project]
name = "tinyrecorder"
description = "Compact PySide6 system tray speech-to-text app for Linux"
version = "0.1.0"
license = { text = "GPL-3.0" }
requires-python = ">=3.12"
dependencies = [
    "rusty-results>=1.1.1",
    "colorlog>=6.10.1",
    "PySide6>=6.9.0",
    "qasync>=0.27.1",
    "sounddevice>=0.5.1",
    "soundfile>=0.13.1",
    "numpy>=2.2.4",
    "scipy>=1.15.2",
    "noisereduce>=3.0.3",
    "openai>=1.75.0",
    "httpx>=0.28.1",
    "typer>=0.15.2",
    "tomli-w>=1.2.0",
    "pydub>=0.25.1",
]

[project.scripts]
tinyrecorder = "tinyrecorder.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-qt>=4.5.0",
    "pytest-httpserver>=1.1.0",
    "ruff>=0.14.6",
    "basedpyright>=1.34.0",
    "pre-commit",
    "poethepoet",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/tinyrecorder"]

[tool.basedpyright]
pythonPlatform = "All"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"
reportImplicitStringConcatenation = "none"
reportUnusedCallResult = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryTypeIgnoreComment = "error"
reportMissingModuleSource = "error"
reportPrivateUsage = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportAttributeAccessIssue = "error"
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "venv", ".venv", "*.egg", "*.egg-info",
    "**/dist", "**/build", "**/__pycache__",
    ".git", ".pytest_cache",
]

[tool.ruff.lint]
extend-select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "ASYNC",
    "S",
    "B",
    "A",
    "C4",
    "SIM",
    "PT",
    "PERF",
    "RUF",
]
ignore = [
    "N802",   # Qt event handlers use camelCase
    "S101",   # assert usage (needed in tests and preconditions)
    "RUF001", # ambiguous unicode (Russian text)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PT018"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sounddevice" = { msg = "Use tinyrecorder.audio.devices or tinyrecorder.audio.recorder instead" }
"noisereduce" = { msg = "Use tinyrecorder.audio.processor instead" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = ["-n", "auto", "--dist", "worksteal", "-m", "not e2e"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests (requires qt-ai-dev-tools VM)",
]

[tool.poe.tasks]
test = "pytest"
app = "python -m tinyrecorder"
install_local_desktop.shell = "uv run --script scripts/install_local_desktop.py"
lint_full.shell = "basedpyright . && ruff check --fix . && ruff format ."
